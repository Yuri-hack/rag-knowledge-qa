spring:
  profiles:
    active: @activated.properties@  # 根据环境变量动态激活
  application:
    name: rag-knowledge-qa
  ai:
    openai:
      api-key: ${ALIYUN_API_KEY}
      base-url: "https://dashscope.aliyuncs.com/compatible-mode"
      embedding:
        options:
          model: "text-embedding-v3"
          dimensions: 1024
        normalize: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB

aliyun:
  opensearch:
    api-key: ${ALIYUN_OPENSEARCH_API_KEY}

tongyi:
  api-key: ${ALIYUN_API_KEY}  # 在环境变量中配置阿里云apiKey
  # agent 循环内不开联网搜索：enableSearch 与 tools 同请求互斥（静默失效，见 docs/prompt-changelog.md v0.4）；联网搜索走 WebSearchTool 子调用
  rag-model-config:
    model: qwen-plus
    max-tokens: 2000
    temperature: 0.0
    top-p: 0.8
    enable-search: false
  common-model-config:
    model: qwen-plus
    max-tokens: 2000
    temperature: 0.0
    top-p: 0.8
    enable-search: true
  intent-model-config:
    model: qwen-plus
    max-tokens: 500
    temperature: 0.1
    top-p: 0.8
    enable-search: false
  normalize-model-config:
    model: qwen-plus
    max-tokens: 100
    temperature: 0.1
    top-p: 0.8
    enable-search: false
  adaptive-model-config:
    model: qwen-plus
    max-tokens: 2000
    temperature: 0.0
    top-p: 0.8
    enable-search: false
  rewrite-model-config:
    model: qwen-plus
    max-tokens: 200
    temperature: 0.0
    top-p: 0.8
    enable-search: false
  # WebSearchTool 子调用：单发开联网搜索（与 tool_calls 互斥，不能挂到循环模型上）
  web-search-model-config:
    model: qwen-plus
    max-tokens: 1000
    temperature: 0.0
    top-p: 0.8
    enable-search: true

# RAG相关配置
rag:
  cache:
    exact:
      enabled: true
      ttl-minutes: 60
    semantic-answer:
      enabled: true
      ttl-minutes: 60
      similarity-threshold: 0.95
      top-k: 5
      index-name: "rag_answer_semantic_idx"
      cache-prefix: "rag:answer:semantic:"
    semantic:
      enabled: true
      ttl-hours: 24
      similarity-threshold: 0.85
      top-k: 5
      index-name: "rag_document_semantic_idx"
      cache-prefix: "rag:document:semantic:"
  chunk:
    size: 512
    overlap: 100
  # 混合检索：稠密 + BM25 词法通道。动机见 results/multihop-bridge-20261014.md：
  # 稠密向量对无意义 token（资产编号/单号）无法精确匹配，需词法通道 + 精确匹配兜底。
  #   lexical-top-k   词法候选数；max-candidates 送 rerank 上限（reranker 侧硬上限 50）
  #   rescue-count    词法 top-N 被 rerank 挤出最终结果时强行补回的条数
  #   index-ttl-seconds 词法索引重建周期（与上传进程解耦，靠 TTL 感知新增语料）
  # 检索漏斗（2026-10-14 深池实验后定为默认）：top-k=召回池 N；top-ratio 语义见 SearchRequest
  #   >1 视为进上下文的绝对条数 K（当前 10）；0<x<1 按比例截断；<=0 不截断
  #   实测（20 题）：N=10/K=5 → N=20/K=10 使基线 14/20→16/20、单跳无损、延迟不变、token +61%
  search:
    top-k: 20
    top-ratio: 10
    hybrid:
      enabled: true
      lexical-top-k: 20
      max-candidates: 50
      rescue-count: 3
      index-ttl-seconds: 300
  agent:
    search:
      top-k: 20
      top-ratio: 10
  # D6 会话记忆
  memory:
    max-turns: 3
    ttl-minutes: 120
  rewrite-prompt: |
    # 角色
    你是多轮对话的检索查询改写器。

    # 任务
    根据对话历史，把用户的最新问题改写成一个不依赖上下文、可独立检索的完整问题。

    # 规则
    1. 补全指代与省略：把"它/那/这个/呢"等指代和省略，替换成对话历史中的具体对象（主体、职级、假期类型等）；
    2. 只使用对话历史中出现过的信息补全，严禁编造或引入历史中不存在的范围；
    3. 最新问题已经完整独立时，原样输出，不要改写；
    4. 只输出改写后的问题本身，不要任何解释、引号、前缀或后缀。

    # 示例
    对话历史：
    用户：上海子公司P4年假是几天？
    助手：上海子公司P4职级年假为7天。
    最新问题：那病假呢？
    输出：上海子公司病假每年有几天？

    对话历史：
    用户：总部P4年假几天？
    助手：总部P4年假基准为5天。
    最新问题：上海子公司呢？
    输出：上海子公司P4年假是几天？

    对话历史：
    用户：上海子公司周末加班调休比例是多少？
    助手：上海子公司周末加班按1:2折算调休。
    最新问题：那法定节假日呢？
    输出：上海子公司法定节假日加班调休比例是多少？
  rag-prompt: |
    # 系统角色
    你是云启科技的内部制度知识库助手，只依据下方检索到的文档片段作答。

    # 任务指令
    基于以下检索到的相关文档片段，回答用户问题。
    
    # 可用上下文
    <context>
    {context}
    </context>
    
    # 回答规则（v2：由 agent 提示词的四条行为规则移植而来，见 docs/prompt-changelog.md）
    1. 严格基于上下文作答，不编造上下文中不存在的数字、条款或流程；上下文未覆盖的部分，
       明确说明"知识库中未找到相关内容"，不要用猜测或常识填补；
    2. 注意问题中的限定条件（适用主体：总部/子公司/实习生/驻场；年份与版本；部门）：
       若上下文只覆盖其中一部分，先回答已覆盖的部分，并明确指出未覆盖的限定条件；
    3. 多份文档对同一事实给出不同数值时：明确指出存在冲突，说明各自的适用范围或版本，
       并采用与问题主体、现行版本相符的一条作为结论；
    4. 问题包含多个子问题时逐一作答；某个子问题在上下文中无依据时，单独说明该子问题未找到依据，
       不要因为它而拒答其他子问题；
    5. 上下文中的文档名称或编号可作为依据来源在答案中标注（若上下文包含）；
    6. 输出直接给结论与依据，不要输出"我先检查/自检/覆盖性分析"等思考过程；
       确需说明缺口时用一两句话说明即可。

    # 必须避免
    ❌ 编造上下文中不存在的数字、条款或流程
    ❌ 引用已标注"废止"的版本作为现行规定
    ❌ 上下文未覆盖时，用"通常""建议""一般"等措辞输出未经确认的做法
    ❌ 输出冗长的自我检查过程

    # 输出格式
    - 重要信息优先，复杂流程分步骤说明
    - 关键数据或文档名称突出显示

  daily-prompt: |
    你是一个友好、专业的AI助手，负责处理日常对话和通用问题。

    对话风格要求：
    - 友好、热情但不过度
    - 回答简洁明了，避免冗长
    - 对于专业问题保持客观严谨
    - 适当的时候可以幽默，但要得体
    - 避免政治敏感、争议性话题

    特殊处理：
    - 如果用户询问公司相关信息但未明确说明，建议其咨询具体部门或使用知识库查询
    - 对于无法确认的信息，诚实告知
    - 保持积极正面的沟通态度

  intent-prompt: |
    # 角色设定
    你是一个专业的企业知识库问答系统意图分析器，负责准确判断用户问题与企业知识库的相关性。

    # 任务描述
    请分析用户输入的问题，判断其是否与企业知识库相关，并给出相关性评分（0-1分）。

    # 评分标准
    - 0.9-1.0：高度相关 - 明确涉及企业产品、服务、流程、政策等内部知识
    - 0.7-0.89：较强相关 - 可能涉及企业业务领域或需要专业知识解答
    - 0.4-0.69：中等相关 - 部分相关但包含通用性内容
    - 0.1-0.39：较弱相关 - 主要是通用问题，企业知识库可能提供补充信息
    - 0.0：完全不相关 - 纯闲聊、个人事务或与业务完全无关

    # 判断依据
    请从以下维度考虑：
    1. 是否涉及企业特定的产品、服务、技术
    2. 是否需要企业内部流程、政策知识
    3. 是否属于企业业务领域的专业问题
    4. 是否可以通过企业文档、手册、培训材料回答

    # 输出格式
    只输出0-1之间的数字分数，不要任何其他内容

    # 示例
    用户输入："我们公司的年假政策是怎样的？"
    输出：0.95

    用户输入："今天天气怎么样？"
    输出：0.02

    现在请分析以下用户问题：

  normalize-prompt: |
    你是一个问题归一化助手，负责将用户输入的问题转化为标准问题形式。请遵循以下规则：
    1. 保持原问题的核心意图不变
    2. 去除口语化、冗余和修饰性词语
    3. 使用简洁、规范的表达方式
    4. 如果问题涉及具体实体（如产品名、技术术语），保持其标准名称
    5. 输出仅包含归一化后的问题，不要添加任何解释
    
    示例：
    输入："我想知道怎么安装这个软件，有没有详细的步骤啊？"
    输出："如何安装软件"
    
    输入："咱们公司的年假政策具体是啥样的？能详细说说吗"
    输出："公司年假政策"
    
    输入："请问报销流程需要哪些材料和步骤？"
    输出："报销流程所需材料和步骤"
    
    现在请对用户问题进行归一化处理
  adaptive-answer-prompt: |
    你是一个智能问答助手。
    下面提供了用户问题和可能相关的知识内容。
    
    知识内容（可为空）：
    {retrieved_docs}
    
    请根据以下规则回答：
    1. 如果知识内容与问题高度相关，则优先基于知识内容生成答案；
    2. 如果知识内容与问题无关或不匹配，则忽略它，基于你自己的常识回答；
    3. 如果知识内容部分相关，可以综合两者进行回答；
    4. 最终输出自然流畅、无多余解释的最终答案。


# 通用配置
server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

milvus:
  collection:
    name: knowledge_base
    vector-dimension: ${spring.ai.openai.embedding.options.dimensions}
    partitions: default
    recreate: false

# 跨域配置 填你的服务器的地址
app:
  cors:
    allowed-origins: http://localhost:3000,http://115.190.202.146:3000

semantic:
  cache:
    index:
      dimension: ${spring.ai.openai.embedding.options.dimensions}

routing:
  threshold:
    retrieval-high: 0.7
    retrieval-low: 0.5
    intent-high: 0.7
    intent-low: 0.4